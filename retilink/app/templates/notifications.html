{% extends "base.html" %}{% block content %}
<h1 class="text-2xl font-semibold mb-4">Notifications</h1>
<div class="card">{% for n in ns %}<div class="flex gap-3 py-2 border-b text-sm {{ '' if n.read else 'font-semibold' }}"><span class="text-slate-500 w-48">{{ n.created_at|dt }}</span><a class="underline" href="{{ n.link }}">{{ n.body }}</a>{% if n.digest %}<span class="pill st-na">digest</span>{% endif %}</div>{% else %}<p class="text-slate-500">No notifications.</p>{% endfor %}</div>{% endblock %}
